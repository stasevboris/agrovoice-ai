name: agrovoice-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agrovoice
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run setup_env.py first}
      POSTGRES_DB: agrovoice
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agrovoice -d agrovoice"]
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: 1g
  api:
    build: .
    image: agrovoice-dev-api:local
    environment:
      DATABASE_URL: postgresql+psycopg://agrovoice:${DB_PASSWORD}@db:5432/agrovoice
      JWT_SECRET: ${JWT_SECRET:?Run setup_env.py first}
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8027:80"
    depends_on: [api]
    mem_limit: 64m
  tests:
    image: agrovoice-dev-api:local
    profiles: [test]
    environment:
      DATABASE_URL: postgresql+psycopg://agrovoice:${DB_PASSWORD}@db:5432/agrovoice_test
      JWT_SECRET: isolated-test-secret-not-valid-for-the-live-api
    command: [python, -m, pytest, -q, -p, "no:cacheprovider", "--junitxml=/results/pytest.xml"]
    volumes:
      - ../artifacts/verification/server_20261019:/results
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
volumes:
  postgres:
