name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-pipeline/requirements-ci.txt
      - run: python -m pip install -r ml-pipeline/requirements-ci.txt
      - run: python -X utf8 -m unittest discover -s ml-pipeline/tests
      - run: python -X utf8 kb/validate_kb.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      # Tracked manifests/knowledge are sufficient for compile and JVM tests.
      # No weights, Vosk downloads, device operations or APK publication in CI.
      - working-directory: android-app
        run: bash gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/reports/lint-results-debug.*
            android-app/app/build/test-results/
          retention-days: 7
