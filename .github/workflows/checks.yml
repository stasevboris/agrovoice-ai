name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-pipeline/requirements-ci.txt
      - run: python -m pip install -r ml-pipeline/requirements-ci.txt
      - run: python -X utf8 -m unittest discover -s ml-pipeline/tests
      - run: python -X utf8 kb/validate_kb.py

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          # The retired SDK "tools" package is no longer in Google's repository.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Compile/JVM checks need the pinned native API AAR, not model weights.
      - run: python -X utf8 android-app/fetch_assets.py --runtime-only
      # APK packaging is separate: it refuses missing vision, ASR and TTS assets.
      - working-directory: android-app
        run: bash gradlew --no-daemon testFieldDebugUnitTest testLabDebugUnitTest lintFieldDebug lintLabDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/reports/lint-results-*.html
            android-app/app/build/reports/lint-results-*.xml
            android-app/app/build/test-results/
          retention-days: 7
